<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Meta Ads Automation{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1f2328; --muted: #6b7280;
    --accent: #2563eb; --accent-ink: #ffffff; --border: #e5e7eb;
    --good: #16a34a; --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header a { color: var(--ink); text-decoration: none; font-weight: 600; }
  header nav a { margin-left: 18px; color: var(--muted); font-weight: 500; font-size: 14px; }
  header nav a:hover { color: var(--accent); }
  main { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 5px; }
  label.inline { display: inline; font-weight: 500; }
  input[type=text], input[type=number], input[type=password], textarea, select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--ink); }
  textarea { min-height: 80px; resize: vertical; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  button, .btn { background: var(--accent); color: var(--accent-ink); border: none;
    padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: 600;
    cursor: pointer; text-decoration: none; display: inline-block; }
  button.secondary, .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--border); }
  button:hover, .btn:hover { opacity: 0.9; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 14px 0; }
  .checkbox-row input { width: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  code, pre { background: #f3f4f6; border-radius: 6px; }
  pre { padding: 12px; overflow-x: auto; }
  code { padding: 2px 5px; font-size: 12.5px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.active { background: #dcfce7; color: var(--good); }
  .badge.ended { background: #f3f4f6; color: var(--muted); }
  .log { background: #0b1020; color: #cbd5e1; font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px; padding: 14px; border-radius: 8px; height: 320px; overflow-y: auto; white-space: pre-wrap; }
  .status-pill { padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .status-running { background: #fef9c3; color: #854d0e; }
  .status-done { background: #dcfce7; color: var(--good); }
  .status-error { background: #fee2e2; color: var(--bad); }
  .flash { background: #fee2e2; color: var(--bad); border: 1px solid #fecaca; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
  .report-md h1 { font-size: 20px; }
  .report-md h2 { border-top: 1px solid var(--border); padding-top: 16px; }
  .report-md h3 { font-size: 14px; margin: 16px 0 6px; }
  .report-md ol { padding-left: 20px; }
  .report-md video, .report-md img { background: #000; }
</style>
</head>
<body>
<header>
  <a href="{{ url_for('index') }}">Meta Ads Automation</a>
  <nav>
    <a href="{{ url_for('index') }}">Run</a>
    <a href="{{ url_for('reports') }}">Reports</a>
    <a href="{{ url_for('settings') }}">Settings</a>
  </nav>
</header>
<main>
{% for msg in get_flashed_messages() %}
  <div class="flash">{{ msg }}</div>
{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
